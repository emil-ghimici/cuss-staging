# Builds the Eleventy site and publishes it with GitHub Pages.
# - In the staging repo (cuss-staging) every push to main deploys, with noindex and the /cuss-staging/ path.
# - In the live repo (cuss-website) every push to main deploys cuss.ie (Pages source switched to Actions 2026-11-25).
# - Either repo can also be deployed by hand (Run workflow), e.g. after a failed run.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STAGING: ${{ github.repository == 'emil-ghimici/cuss-staging' && '1' || '' }}
      PATH_PREFIX: ${{ github.repository == 'emil-ghimici/cuss-staging' && '/cuss-staging/' || '/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx @11ty/eleventy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
